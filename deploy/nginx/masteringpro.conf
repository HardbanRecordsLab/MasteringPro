# MasteringPro — HBRL VPS vhost (host nginx, TLS via certbot)
#
#   masteringpro.hardbanrecordslab.online      → static SPA  (/opt/masteringpro/dist)
#   api.masteringpro.hardbanrecordslab.online  → API container (127.0.0.1:8787)
#
# Install:
#   ln -s /opt/masteringpro/deploy/nginx/masteringpro.conf /etc/nginx/sites-enabled/
#   certbot certonly --webroot -w /var/www/certbot \
#     -d masteringpro.hardbanrecordslab.online -d api.masteringpro.hardbanrecordslab.online
#   nginx -t && systemctl reload nginx

# ---- HTTP → HTTPS + ACME ----------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name masteringpro.hardbanrecordslab.online api.masteringpro.hardbanrecordslab.online;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---- Frontend (static SPA) -------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name masteringpro.hardbanrecordslab.online;

    ssl_certificate     /etc/letsencrypt/live/masteringpro.hardbanrecordslab.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/masteringpro.hardbanrecordslab.online/privkey.pem;

    root /opt/masteringpro/dist;
    index index.html;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Hashed assets — long cache
    location /assets/     { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /worklets/   { expires 1h; add_header Cache-Control "public"; try_files $uri =404; }
    location = /site.webmanifest { add_header Cache-Control "public, max-age=3600"; }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 4m;
}

# ---- API (Hono container on loopback) -------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.masteringpro.hardbanrecordslab.online;

    ssl_certificate     /etc/letsencrypt/live/masteringpro.hardbanrecordslab.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/masteringpro.hardbanrecordslab.online/privkey.pem;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
